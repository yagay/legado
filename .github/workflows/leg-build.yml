# Manual build trigger: 2026-08-12
name: Leg Branch Build

on:
  push:
    branches: [leg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leg-branch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply review summary patch
        run: |
          python .github/scripts/review_summary_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/legado/app/ui/book/read/ReadBookActivity.kt
          git diff --cached --quiet || git commit -m "route review summary loading through ReviewLoader"
          git push
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build debug APK
        run: ./gradlew assembleAppDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-leg-debug
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
