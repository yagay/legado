# Manual build trigger: 2026-08-12
name: Leg Branch Build

on:
  push:
    branches: [leg]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leg-branch-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: leg
      - name: Apply nullable book review binding fix
        run: |
          python .github/scripts/fix_book_review_binding_nullable.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/io/legado/app/ui/book/info/BookInfoActivity.kt
            git commit -m "fix nullable book review entry binding [skip ci]"
            git push origin HEAD:leg
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build debug APK
        run: ./gradlew assembleAppDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: legado-leg-debug
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
