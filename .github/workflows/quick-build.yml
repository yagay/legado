name: Quick Build

on:
  pull_request:
    paths:
      - '.github/quick-build-trigger/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Prepare Assets
        run: |
          echo "" > "$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt"

      - name: Quick Debug Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --build-cache --parallel --daemon --warning-mode all
