name: Review Loader Apply

on:
  push:
    branches:
      - leg
    paths:
      - '.github/workflows/review-loader-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: leg
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/review_loader_patch.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'ReviewLoader.loadDetail' app/src/main/java/io/legado/app/ui/book/read/ReviewDetailDialog.kt
      - name: Commit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/legado/app/ui/book/read/ReviewDetailDialog.kt
          git commit -m 'route review detail loading through ReviewLoader'
          git push origin HEAD:leg
